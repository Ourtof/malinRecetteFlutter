name: Tests Flutter

on:
  push:
    branches: [dev, main]

  pull_request:
    branches: [dev, main]

jobs:
  tests:
    name: Tests Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with: 
          flutter-version: '3.38.7'
          channel: stable

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Exécuter les tests Flutter
        run: flutter test
  
  preparation-deploiement:
    name: Préparer le déploiement
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: compiler Flutter Web
        run: flutter build web --release

      - name: Créer l'artifact de déploiement
        uses: actions/upload-artifact@v7
        with:
          name: malinrecette-frontend
          path: build/web/